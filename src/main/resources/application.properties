spring.application.name=biblioteca-api

# Banco H2 em arquivo: os dados continuam salvos mesmo depois de reiniciar o servidor
spring.datasource.url=jdbc:h2:file:./data/bibliotecadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria e atualiza a tabela automaticamente a partir da @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false